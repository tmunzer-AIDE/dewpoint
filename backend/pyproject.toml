[project]
name = "dewpoint"
version = "0.1.0"
description = "Multi-tenant no-code automation for Juniper Mist"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30",
  "alembic>=1.14",
  "argon2-cffi>=23.1",
  "pyotp>=2.9",
  "webauthn>=2.2",
  "cryptography>=43",
  "httpx>=0.28",
  "typer>=0.13",
  "structlog>=24.4",
  "jsonschema>=4.23",
  "cel-expr-python==0.1.3",
  "protobuf>=7.35.1,<8",
  "temporalio==1.33.0",
  "ahocorasick-rs>=0.22",
  "websockets>=17.1,<18",
]

[project.scripts]
dewpoint = "dewpoint.apps.cli.main:app"

[project.entry-points."dewpoint.plugins"]
flow = "dewpoint.plugins.flow:PLUGIN"
mist = "dewpoint.plugins.mist:PLUGIN"
slack = "dewpoint.plugins.slack:PLUGIN"
teams = "dewpoint.plugins.teams:PLUGIN"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "testcontainers[postgres]>=4.8",
  "respx>=0.21",
  "hypothesis>=6.115",
  "ruff>=0.7",
  "mypy>=1.13",
  "import-linter>=2.1",
  "pip-licenses>=5.0",
  "types-jsonschema>=4.23",
  "types-protobuf>=7.35",
  "pytest-xdist>=3.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dewpoint"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["src/dewpoint/engine/cel/proto/*_pb2.py", "src/dewpoint/engine/cel/proto/*_pb2.pyi"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency/parameter markers are designed to be used as argument defaults.
extend-immutable-calls = [
  "fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body", "fastapi.Header",
  "dewpoint.core.http.require",
]

[tool.ruff.lint.per-file-ignores]
# Tests: asserts, fixed test credentials, `uv` on PATH, and DDL built from constant role names.
"tests/**" = ["S101", "S105", "S106", "S603", "S607", "S608"]
# Migrations: DDL/policies are built from module constants only, never from user input; long lines are SQL text.
"migrations/**" = ["S608", "E501"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"

[[tool.mypy.overrides]]
# Vendored protoc output: the .pyi stubs next to it are what mypy reads (see engine/cel/proto/README.md).
module = ["dewpoint.engine.cel.proto.*"]
ignore_errors = true

[[tool.mypy.overrides]]
# cel-expr-python ships a .pyi but no py.typed marker; only engine.cel.runtime imports it.
module = ["cel_expr_python", "cel_expr_python.*"]
ignore_missing_imports = true

[tool.importlinter]
root_package = "dewpoint"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "core does not depend on apps"
type = "forbidden"
source_modules = ["dewpoint.core"]
forbidden_modules = ["dewpoint.apps"]

[[tool.importlinter.contracts]]
name = "fastapi only in apps and core.http"
type = "forbidden"
source_modules = ["dewpoint.core"]
forbidden_modules = ["fastapi"]
ignore_imports = ["dewpoint.core.http -> fastapi"]
unmatched_ignore_imports_alerting = "none"
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "sdk is self-contained"
type = "forbidden"
source_modules = ["dewpoint.sdk"]
forbidden_modules = ["dewpoint.core", "dewpoint.engine", "dewpoint.plugins", "dewpoint.apps"]

[[tool.importlinter.contracts]]
name = "plugins depend only on the sdk"
type = "forbidden"
source_modules = ["dewpoint.plugins"]
forbidden_modules = ["dewpoint.core", "dewpoint.engine", "dewpoint.apps"]

[[tool.importlinter.contracts]]
name = "engine is pure and depends only on the sdk"
type = "forbidden"
source_modules = ["dewpoint.engine"]
forbidden_modules = ["dewpoint.core", "dewpoint.plugins", "dewpoint.apps", "sqlalchemy", "asyncpg", "fastapi", "httpx"]

[[tool.importlinter.contracts]]
name = "core depends on neither engine nor plugins"
type = "forbidden"
source_modules = ["dewpoint.core"]
forbidden_modules = ["dewpoint.engine", "dewpoint.plugins"]

[[tool.importlinter.contracts]]
name = "only the CEL runtime adapter imports cel-expr-python"
type = "forbidden"
source_modules = ["dewpoint"]
forbidden_modules = ["cel_expr_python"]
ignore_imports = ["dewpoint.engine.cel.runtime -> cel_expr_python"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "engine.cel reads no schemas and no graph"
type = "forbidden"
source_modules = ["dewpoint.engine.cel"]
forbidden_modules = ["dewpoint.engine.graph", "dewpoint.engine.registry", "jsonschema", "pydantic"]

[[tool.importlinter.contracts]]
name = "the CEL evaluator loads only engine.cel and the standard library"
type = "forbidden"
source_modules = ["dewpoint.apps.cel_evaluator"]
forbidden_modules = [
  "dewpoint.core", "dewpoint.plugins", "dewpoint.sdk", "dewpoint.engine.graph", "dewpoint.engine.registry",
  "sqlalchemy", "asyncpg", "fastapi", "pydantic", "jsonschema", "httpx", "temporalio", "cryptography",
]

[[tool.importlinter.contracts]]
name = "ingress imports neither the API, the dispatcher, the worker nor Temporal, and no tenant key's code (spec §8.3)"
type = "forbidden"
source_modules = ["dewpoint.apps.ingress"]
forbidden_modules = [
  "dewpoint.apps.api", "dewpoint.apps.dispatcher", "dewpoint.apps.worker", "dewpoint.apps.admission", "temporalio",
  "dewpoint.core.crypto.kek", "dewpoint.core.crypto.keyring", "dewpoint.core.crypto.keys", "dewpoint.core.ingress.keys",
]

[[tool.importlinter.contracts]]
name = "engine.runtime is deterministic: no clock, randomness, I/O or threads (spec §6)"
type = "forbidden"
source_modules = ["dewpoint.engine.runtime"]
forbidden_modules = ["random", "secrets", "time", "socket", "subprocess", "threading", "os", "structlog"]
