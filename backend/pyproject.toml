[project]
name = "dewpoint"
version = "0.1.0"
description = "Multi-tenant no-code automation for Juniper Mist"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic[email]>=2.9",
  "pydantic-settings>=2.6",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30",
  "alembic>=1.14",
  "argon2-cffi>=23.1",
  "pyotp>=2.9",
  "webauthn>=2.2",
  "cryptography>=43",
  "httpx>=0.28",
  "typer>=0.13",
  "structlog>=24.4",
]

[project.scripts]
dewpoint = "dewpoint.apps.cli.main:app"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "testcontainers[postgres]>=4.8",
  "respx>=0.21",
  "hypothesis>=6.115",
  "ruff>=0.7",
  "mypy>=1.13",
  "import-linter>=2.1",
  "pip-licenses>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dewpoint"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
# Tests: asserts, fixed test credentials, `uv` on PATH, and DDL built from constant role names.
"tests/**" = ["S101", "S105", "S106", "S607", "S608"]
# Migrations: DDL/policies are built from module constants only, never from user input.
"migrations/**" = ["S608"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"

[tool.importlinter]
root_package = "dewpoint"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "core does not depend on apps"
type = "forbidden"
source_modules = ["dewpoint.core"]
forbidden_modules = ["dewpoint.apps"]

[[tool.importlinter.contracts]]
name = "fastapi only in apps and core.http"
type = "forbidden"
source_modules = ["dewpoint.core"]
forbidden_modules = ["fastapi"]
ignore_imports = ["dewpoint.core.http -> fastapi"]
unmatched_ignore_imports_alerting = "none"
allow_indirect_imports = true
