name: ci
# Once per commit: a pull request's, and main's. A branch without a pull request runs only when started by hand.
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:
# A newer commit on a pull request cancels the run of the one before it; every other run stands on its own.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true
permissions: { contents: read }
env:
  # The CEL gates' tests (spec §5.9): run by cel-gates, in its pinned container, and nowhere else. A gate that times
  # its work isn't run again in backend's process among thousands of other tests (a pause there failed it).
  CEL_GATE_TESTS: >-
    tests/apps/cel_evaluator tests/engine/cel tests/engine/graph/test_validate_cel.py
    tests/apps/worker/test_gate_task_cost.py
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }  # the replay gate compares with the base
      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src
      - run: uv run lint-imports
      # One worker per core (4 on a public repository's runner), each with fixtures of its own; CEL_GATE_TESTS run in
      # cel-gates. Serial, the suite took 29 min there.
      - run: uv run pytest -q -n auto $(printf -- '--ignore=%s ' $CEL_GATE_TESTS)
      # The replay gate (spec §7): the suite replays this ABI's histories; this checks none was changed or removed,
      # and that new ones went into this build's directory.
      # The base: a pull request's base, main's previous commit, or a branch's merge base with main (gate.base_for).
      - name: Recorded histories are never rewritten
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
        run: uv run python -m tests.engine.replay.gate --event "$EVENT" --ref "$REF" --pr-base "$PR_BASE" --before "$BEFORE"
      - run: uv run pip-licenses --fail-on="GPL;AGPL;LGPL;SSPL;BUSL" --partial-match
      # The web client is generated from the API's schema (sub-project 4, B1): the committed copy must be what the API
      # serves. Regenerate with `uv run dewpoint api openapi > ../frontend/src/api/openapi.json`, then `pnpm gen:api`.
      - name: The web client's API schema is current
        run: |
          uv run dewpoint api openapi > "$RUNNER_TEMP/openapi.json"
          diff -u ../frontend/src/api/openapi.json "$RUNNER_TEMP/openapi.json"
  cel-gates:
    # The CEL gates (spec §5.9) in a pinned Linux container: rlimits, fork and cgroup behaviour are Linux's. The
    # engine and evaluator tests need no database, so this job runs without Docker.
    runs-on: ubuntu-latest
    container: python:3.12-slim-bookworm
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4
      - run: uv sync --locked
      # The evaluator's fork tests first: they need a process in which nothing has started a Temporal worker's
      # threads yet, and gate 4 (tests/engine/cel) starts one.
      - run: uv run pytest -q $CEL_GATE_TESTS
        env: { DEWPOINT_CEL_GATE_RESULTS: cel-gate-results }
      # The measurements matter most when a gate fails: print and keep them either way.
      - if: always()
        run: cat cel-gate-results/*.json || echo "no CEL gate results"
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: cel-gate-results, path: backend/cel-gate-results/ }
  security:
    runs-on: ubuntu-latest
    permissions: { contents: read, pull-requests: read }  # gitleaks lists the PR's commits
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with: { scan-type: fs, scan-ref: ., severity: "HIGH,CRITICAL", exit-code: "1" }
  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4  (version comes from package.json "packageManager")
        with: { package_json_file: frontend/package.json }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: frontend/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - name: The generated API types match the committed schema
        run: pnpm check:api
      - run: pnpm lint && pnpm typecheck && pnpm test && pnpm build
  # Its own job, which e2e doesn't need: a licence awaiting the owner's review keeps it red without hiding the
  # frontend's checks or the browser gate (ledger, ruling 35).
  frontend-licences:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4  (version comes from package.json "packageManager")
        with: { package_json_file: frontend/package.json }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: frontend/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - name: Licences (D22) - production on the allowlist; dev tools may add MPL-2.0; anything else is the owner's review
        run: |
          set -o pipefail
          node scripts/licence-check.mjs --self-test
          node scripts/third-party-notices.mjs --self-test
          pnpm licenses list --json --prod | node scripts/licence-check.mjs prod
          pnpm licenses list --json | node scripts/licence-check.mjs all
  e2e:
    runs-on: ubuntu-latest
    needs: [frontend]  # not backend: it builds its own images, and waiting for backend's suite only made CI longer
    # A development deployment (engine 2b spec §2.1): every compose command below uses the override.
    # Webhook ingress runs only under its profile (a gated prototype until 2b-4, engine 2b spec §8.3).
    env: { COMPOSE_FILE: "docker-compose.yml:docker-compose.dev.yml", COMPOSE_PROFILES: ingress }
    steps:
      - uses: actions/checkout@v4
      - name: Write CI env
        working-directory: deploy/compose
        run: |
          {
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 16)"
            echo "DEWPOINT_API_DB_PASSWORD=$(openssl rand -hex 16)"
            echo "DEWPOINT_ADMIN_DB_PASSWORD=$(openssl rand -hex 16)"
            echo "DEWPOINT_AUDITOR_DB_PASSWORD=$(openssl rand -hex 16)"
            echo "DEWPOINT_WORKER_DB_PASSWORD=$(openssl rand -hex 16)"
            echo "DEWPOINT_DISPATCH_DB_PASSWORD=$(openssl rand -hex 16)"
            echo "DEWPOINT_INGRESS_DB_PASSWORD=$(openssl rand -hex 16)"
            echo "DEWPOINT_RETENTION_DB_PASSWORD=$(openssl rand -hex 16)"
            echo "DEWPOINT_KEK_B64=$(openssl rand -base64 32)"
            echo "DEWPOINT_INGRESS_KEY_B64=$(openssl rand -base64 32)"
            echo "DEWPOINT_AUDIT_SIGNING_KEY_B64=$(openssl rand -base64 32)"
          } > .env
      - working-directory: deploy/compose
        run: |
          docker compose up -d --build --wait
          set -a; . ./.env; set +a
          docker compose run --rm -e DEWPOINT_INIT_PASSWORD=violet-otter-canyon-42 \
            -e DEWPOINT_DATABASE_URL="postgresql+asyncpg://dewpoint_api_login:${DEWPOINT_API_DB_PASSWORD}@postgres/dewpoint" \
            api dewpoint admin init --email admin@example.com
      - name: The worker's build is current
        working-directory: deploy/compose
        run: |
          for _ in $(seq 60); do
            docker compose exec -T worker dewpoint deployment status | tee status.txt
            grep -q '^current: dewpoint-' status.txt && exit 0
            sleep 2
          done
          exit 1
      - name: A run through the Compose dispatcher (engine 2b spec §12)
        working-directory: deploy/compose
        timeout-minutes: 5
        run: |
          set -a; . ./.env; set +a
          # The registry, as on every deploy; then a synthetic tenant and a published workflow, as the API's login.
          docker compose run --rm \
            -e DEWPOINT_DATABASE_URL="postgresql+asyncpg://dewpoint_admin_login:${DEWPOINT_ADMIN_DB_PASSWORD}@postgres/dewpoint" \
            api dewpoint plugins sync
          read -r tenant workflow < <(docker compose run --rm -T api python - < ci/seed-workflow.py | tail -n 1)
          # Admitted as the dispatcher's login, started by the Compose dispatcher, run by the worker: exit 0 only when
          # the run the database records succeeded.
          docker compose exec -T dispatcher dewpoint dev run "$workflow" --tenant "$tenant" --wait 120
      - name: A schedule through the Compose dispatcher (engine 2b spec §8.2, §12)
        working-directory: deploy/compose
        timeout-minutes: 5
        run: |
          set -a; . ./.env; set +a
          read -r tenant workflow < <(docker compose run --rm -T api python - < ci/seed-workflow.py | tail -n 1)
          # Every 60 s in Europe/Paris, as the API's login: the API's image must hold the time zone data to accept it.
          # The dispatcher's sync creates its Temporal Schedule and its admission worker admits each firing: exit 0
          # only once the first scheduled run succeeded, within 150 s.
          schedule=$(docker compose run --rm -T api python - create "$tenant" "$workflow" < ci/schedule-proof.py | tail -n 1)
          docker compose run --rm -T api python - wait "$tenant" "$schedule" 150 < ci/schedule-proof.py
      - name: A webhook through nginx and ingress (engine 2b spec §8.3, §12)
        working-directory: deploy/compose
        timeout-minutes: 5
        run: |
          set -a; . ./.env; set +a
          read -r tenant workflow < <(docker compose run --rm -T api python - < ci/seed-workflow.py | tail -n 1)
          # An HMAC endpoint and its binding, as the API's login; the secret, shown once, only ever in this shell.
          read -r endpoint secret < <(docker compose run --rm -T api python - create "$tenant" "$workflow" \
            < ci/ingress-proof.py | tail -n 1)
          body='{"id":"ci-proof-1","type":"ci_proof"}'
          stamp=$(date +%s)
          signature=$(printf '%s.%s' "$stamp" "$body" | openssl dgst -sha256 -hmac "$secret" -r | cut -d' ' -f1)
          post() {
            curl -sS -o response.json -w '%{http_code}' -X POST "http://127.0.0.1:8080/hooks/$endpoint" \
              -H "content-type: application/json" -H "x-dewpoint-timestamp: $stamp" \
              -H "x-dewpoint-signature: $signature" --data-binary "$body"
          }
          # Signed, through nginx to ingress: recorded; the same event again (a sender's retry): acknowledged once.
          # Each check is a command of its own: `bash -e` ignores a failure before a list's last `&&`.
          test "$(post)" = 200
          grep -q '"accepted":1' response.json
          test "$(post)" = 200
          grep -q '"duplicates":1' response.json
          # A body trickled through nginx, a byte every 2 s (under nginx's own gap timeout), streamed to ingress: its
          # 408 within the 10 s whole-body deadline, never minutes later. The time is curl's own, and the trickle stops
          # at its first failed write: the runner ignores SIGPIPE, so it would otherwise outlive curl's answer.
          read -r trickled took < <( (printf '{'; for _ in $(seq 30); do sleep 2; printf ' ' 2>/dev/null || exit 0; done
            printf '}') | curl -sS -o /dev/null -w '%{http_code} %{time_total}\n' --max-time 40 -X POST -T - \
            -H 'Expect:' "http://127.0.0.1:8080/hooks/$endpoint")
          test "$trickled" = 408
          awk -v took="$took" 'BEGIN { exit !(took <= 14) }'
          # Matched by the Compose dispatcher, started and run: exit 0 only once its run succeeded, within 120 s.
          docker compose run --rm -T api python - wait "$tenant" "$endpoint" 120 < ci/ingress-proof.py
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4  (version comes from package.json "packageManager")
        with: { package_json_file: frontend/package.json }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: frontend/pnpm-lock.yaml }
      - working-directory: frontend
        run: pnpm install --frozen-lockfile && pnpm exec playwright install --with-deps chromium && pnpm e2e
      - if: failure()
        working-directory: deploy/compose
        run: docker compose logs --no-color > compose.log
      - if: failure()
        uses: actions/upload-artifact@v4
        with: { name: e2e-debug, path: "frontend/playwright-report\ndeploy/compose/compose.log" }
