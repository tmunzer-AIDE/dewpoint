name: ci
on: [push, pull_request]
permissions: { contents: read }
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }  # the replay gate compares with the base
      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src
      - run: uv run lint-imports
      - run: uv run pytest -q
      # The replay gate (spec §7): the suite replays this ABI's histories; this checks none was changed or removed,
      # and that new ones went into this build's directory.
      # The base: a pull request's base, main's previous commit, or a branch's merge base with main (gate.base_for).
      - name: Recorded histories are never rewritten
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
        run: uv run python -m tests.engine.replay.gate --event "$EVENT" --ref "$REF" --pr-base "$PR_BASE" --before "$BEFORE"
      - run: uv run pip-licenses --fail-on="GPL;AGPL;LGPL;SSPL;BUSL" --partial-match
  cel-gates:
    # The CEL gates (spec §5.9) in a pinned Linux container: rlimits, fork and cgroup behaviour are Linux's. The
    # engine and evaluator tests need no database, so this job runs without Docker.
    runs-on: ubuntu-latest
    container: python:3.12-slim-bookworm
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4
      - run: uv sync --locked
      # The evaluator's fork tests first: they need a process in which nothing has started a Temporal worker's
      # threads yet, and gate 4 (tests/engine/cel) starts one.
      - run: >-
          uv run pytest -q tests/apps/cel_evaluator tests/engine/cel tests/engine/graph/test_validate_cel.py
          tests/apps/worker/test_gate_task_cost.py
        env: { DEWPOINT_CEL_GATE_RESULTS: cel-gate-results }
      # The measurements matter most when a gate fails: print and keep them either way.
      - if: always()
        run: cat cel-gate-results/*.json || echo "no CEL gate results"
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: cel-gate-results, path: backend/cel-gate-results/ }
  security:
    runs-on: ubuntu-latest
    permissions: { contents: read, pull-requests: read }  # gitleaks lists the PR's commits
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with: { scan-type: fs, scan-ref: ., severity: "HIGH,CRITICAL", exit-code: "1" }
  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4  (version comes from package.json "packageManager")
        with: { package_json_file: frontend/package.json }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: frontend/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint && pnpm typecheck && pnpm test && pnpm build
  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    # A development deployment (engine 2b spec §2.1): every compose command below uses the override.
    env: { COMPOSE_FILE: "docker-compose.yml:docker-compose.dev.yml" }
    steps:
      - uses: actions/checkout@v4
      - name: Write CI env
        working-directory: deploy/compose
        run: |
          {
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 16)"
            echo "DEWPOINT_API_DB_PASSWORD=$(openssl rand -hex 16)"
            echo "DEWPOINT_ADMIN_DB_PASSWORD=$(openssl rand -hex 16)"
            echo "DEWPOINT_AUDITOR_DB_PASSWORD=$(openssl rand -hex 16)"
            echo "DEWPOINT_WORKER_DB_PASSWORD=$(openssl rand -hex 16)"
            echo "DEWPOINT_DISPATCH_DB_PASSWORD=$(openssl rand -hex 16)"
            echo "DEWPOINT_KEK_B64=$(openssl rand -base64 32)"
            echo "DEWPOINT_AUDIT_SIGNING_KEY_B64=$(openssl rand -base64 32)"
          } > .env
      - working-directory: deploy/compose
        run: |
          docker compose up -d --build --wait
          set -a; . ./.env; set +a
          docker compose run --rm -e DEWPOINT_INIT_PASSWORD=violet-otter-canyon-42 \
            -e DEWPOINT_DATABASE_URL="postgresql+asyncpg://dewpoint_api_login:${DEWPOINT_API_DB_PASSWORD}@postgres/dewpoint" \
            api dewpoint admin init --email admin@example.com
      - name: The worker's build is current
        working-directory: deploy/compose
        run: |
          for _ in $(seq 60); do
            docker compose exec -T worker dewpoint deployment status | tee status.txt
            grep -q '^current: dewpoint-' status.txt && exit 0
            sleep 2
          done
          exit 1
      - name: A run through the Compose dispatcher (engine 2b spec §12)
        working-directory: deploy/compose
        timeout-minutes: 5
        run: |
          set -a; . ./.env; set +a
          # The registry, as on every deploy; then a synthetic tenant and a published workflow, as the API's login.
          docker compose run --rm \
            -e DEWPOINT_DATABASE_URL="postgresql+asyncpg://dewpoint_admin_login:${DEWPOINT_ADMIN_DB_PASSWORD}@postgres/dewpoint" \
            api dewpoint plugins sync
          read -r tenant workflow < <(docker compose run --rm -T api python - < ci/seed-workflow.py | tail -n 1)
          # Admitted as the dispatcher's login, started by the Compose dispatcher, run by the worker: exit 0 only when
          # the run the database records succeeded.
          docker compose exec -T dispatcher dewpoint dev run "$workflow" --tenant "$tenant" --wait 120
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4  (version comes from package.json "packageManager")
        with: { package_json_file: frontend/package.json }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: frontend/pnpm-lock.yaml }
      - working-directory: frontend
        run: pnpm install --frozen-lockfile && pnpm exec playwright install --with-deps chromium && pnpm e2e
      - if: failure()
        working-directory: deploy/compose
        run: docker compose logs --no-color > compose.log
      - if: failure()
        uses: actions/upload-artifact@v4
        with: { name: e2e-debug, path: "frontend/playwright-report\ndeploy/compose/compose.log" }
