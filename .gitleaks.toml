# Default gitleaks rules, plus a narrow allowlist for documented, non-secret test fixtures and names.
# Allowlist exact values only; never whole directories, so a real secret added to a test still fails CI.
[extend]
useDefault = true

[allowlist]
description = "Test fixtures and names, not credentials: the password unit tests and the e2e admin bootstrap use, a canary secret the engine's tests plant to prove it never reaches Temporal, and the ingress key's environment-variable name, which generic-api-key reads as a value"
regexes = ['''^violet-otter-canyon-42$''', '''^sk-k3y-echoed-canary-0003$''', '''^DEWPOINT_INGRESS_KEY_B64$''']
