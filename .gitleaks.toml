# Default gitleaks rules, plus a narrow allowlist for documented, non-secret test fixtures and names.
# Allowlist exact values only; never whole directories, so a real secret added to a test still fails CI.
[extend]
useDefault = true

[allowlist]
description = "Test fixtures and names, not credentials: the password unit tests and the e2e admin bootstrap use, a canary secret the engine's tests plant to prove it never reaches Temporal, the ingress key's environment-variable name, which generic-api-key reads as a value, and the database password the settings tests plant to prove a startup failure never quotes it"
regexes = ['''^violet-otter-canyon-42$''', '''^sk-k3y-echoed-canary-0003$''', '''^DEWPOINT_INGRESS_KEY_B64$''', '''^pw-0d4e7a5c1e9b$''']
