# Default gitleaks rules, plus a narrow allowlist for documented, non-secret test fixtures.
# Allowlist exact values only; never whole directories, so a real secret added to a test still fails CI.
[extend]
useDefault = true

[allowlist]
description = "Test fixtures, not credentials: the password unit tests and the e2e admin bootstrap use, and a canary secret the engine's tests plant to prove it never reaches Temporal"
regexes = ['''^violet-otter-canyon-42$''', '''^sk-k3y-echoed-canary-0003$''']
