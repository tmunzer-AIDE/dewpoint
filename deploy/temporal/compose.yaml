# SPDX-License-Identifier: Apache-2.0
# D12's and D6's disposable proof environment (2b-4b M4): its own Compose project and network, every image pinned by
# digest, nothing shared with another stack. Driven by the proof suites (backend/tests/proofs), which make the run
# directory first: test certificates, a random database password, MinIO's root credentials, the authorizer's
# put-only credentials and roles, and the key set.
#
#   DEWPOINT_M4_RUN=<run directory> DEWPOINT_M4_CONFIG=mtls|jwt DEWPOINT_M4_DB_PASSWORD=<the run's> \
#     docker compose -p dewpoint-m4 -f deploy/temporal/compose.yaml up -d
#
# Each container mounts only its own part of the run directory: the server its certificates and the authorizer's
# credentials, roles and fault file; never MinIO's root credentials. Published ports are on 127.0.0.1 only. The database password reaches the server as an environment variable
# (Temporal's configuration template reads only those): a disposable environment's random value, never a real one.
name: dewpoint-m4

services:
  postgres:
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets: [db_password]
    tmpfs: [/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "temporal"]
      interval: 2s
      retries: 30

  schema:
    image: temporalio/admin-tools:1.32.0@sha256:a9f84fb9a374b2374fe2e67c8efc0468ff3f1c66c8a0b14597ec86e349e62bca
    depends_on:
      postgres: {condition: service_healthy}
    secrets: [db_password]
    environment:
      SQL_PLUGIN: postgres12
      SQL_HOST: postgres
      SQL_PORT: "5432"
      SQL_USER: temporal
    entrypoint: ["sh", "-ec"]
    command:
      - |
        export SQL_PASSWORD="$$(cat /run/secrets/db_password)"
        for db in temporal temporal_visibility; do
          kind=temporal; [ "$$db" = temporal_visibility ] && kind=visibility
          SQL_DATABASE=$$db temporal-sql-tool create-database
          SQL_DATABASE=$$db temporal-sql-tool setup-schema -v 0.0
          SQL_DATABASE=$$db temporal-sql-tool update-schema -d /etc/temporal/schema/postgresql/v12/$$kind/versioned
        done

  minio:
    image: cgr.dev/chainguard/minio@sha256:4cf4831a2bbcf13ddca09c1cbcc9faff716dd3c4247e0babc32864b8ee8e0034
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER_FILE: /run/secrets/minio_root_user
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/minio_root_password
    secrets: [minio_root_user, minio_root_password]
    tmpfs: ["/data:mode=1777"]
    ports: ["127.0.0.1:${DEWPOINT_M4_S3_PORT:-19000}:9000"]

  jwks:
    image: python:3.12-slim-bookworm@sha256:34386ef0cb081344d7ec1c103ba398e6e9f64e9ab3a1509accc92a4e24a07258
    command: ["python", "-I", "/srv/serve.py"]
    volumes:
      - ./jwks/serve.py:/srv/serve.py:ro
      - ${DEWPOINT_M4_RUN:?the run directory}/jwks:/run/m4/jwks:ro
    environment:
      DEWPOINT_JWKS_FILE: /run/m4/jwks/jwks.json

  temporal:
    image: ${DEWPOINT_M4_IMAGE:-dewpoint-m4/temporal-server:local}
    depends_on:
      schema: {condition: service_completed_successfully}
    environment:
      DEWPOINT_TEMPORAL_CONFIG: /etc/temporal/config.yaml
      DEWPOINT_TEMPORAL_DB_ADDRESS: postgres:5432
      DEWPOINT_TEMPORAL_DB_PASSWORD: ${DEWPOINT_M4_DB_PASSWORD:?the run's database password}
      DEWPOINT_TEMPORAL_JWKS_URL: http://jwks:8080/jwks.json
      DEWPOINT_AUTHZ_CLAIMS: ${DEWPOINT_M4_CONFIG:?mtls or jwt}
      DEWPOINT_AUTHZ_CERT_ROLES: /run/m4/authz/roles.json
      DEWPOINT_AUTHZ_AUDIT_BUCKET: dewpoint-audit
      DEWPOINT_AUTHZ_AUDIT_PREFIX: dewpoint/
      DEWPOINT_AUTHZ_AUDIT_ENDPOINT: http://minio:9000
      DEWPOINT_AUTHZ_AUDIT_FAULTS: /run/m4/authz/faults/namespaces
      AWS_SHARED_CREDENTIALS_FILE: /run/m4/authz/credentials
      AWS_CONFIG_FILE: /dev/null
    volumes:
      - ./config/${DEWPOINT_M4_CONFIG:?mtls or jwt}.yaml:/etc/temporal/config.yaml:ro
      - ${DEWPOINT_M4_RUN:?the run directory}/authz:/run/m4/authz:ro
      - ${DEWPOINT_M4_RUN:?the run directory}/tls:/etc/temporal/tls:ro
    ports:
      - "127.0.0.1:${DEWPOINT_M4_GRPC_PORT:-17233}:7233"
      - "127.0.0.1:${DEWPOINT_M4_HTTP_PORT:-17243}:7243"

secrets:
  db_password:
    file: ${DEWPOINT_M4_RUN:?the run directory}/db_password
  minio_root_user:
    file: ${DEWPOINT_M4_RUN:?the run directory}/minio/root_user
  minio_root_password:
    file: ${DEWPOINT_M4_RUN:?the run directory}/minio/root_password
