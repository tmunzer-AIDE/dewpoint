# SPDX-License-Identifier: Apache-2.0
# Compose's PostgreSQL admission file (2b-4b M4 recovery; design revision 9 §3). The server uses the first line that
# matches, so the recovery logins' lines come first.
#
# Recovery logins (members of dewpoint_recovery, each named rcv_...): admitted on one path alone, over SSL, to the
# dewpoint database, from the operators' addresses, by SCRAM, and then only through a tool that verifies the server
# (sslmode=verify-full against the deployment's own authority). Every other path rejects them explicitly: TCP with or
# without SSL, the Unix socket, another database, replication; by their group, and by their name, so a revoked login no
# longer in the group is rejected too.
#
# 192.0.2.0/24 is a documentation range (RFC 5737), routed nowhere: until a deployment names its operators' addresses
# here, no recovery login is admitted at all. Replace it, one hostssl line per range, all before the reject lines
# (docs/operations/deployment.md).
hostssl  dewpoint     +dewpoint_recovery  192.0.2.0/24  scram-sha-256
host     all          +dewpoint_recovery  all           reject
local    all          +dewpoint_recovery                reject
host     replication  +dewpoint_recovery  all           reject
local    replication  +dewpoint_recovery                reject
host     all          /^rcv_              all           reject
local    all          /^rcv_                            reject
host     replication  /^rcv_              all           reject
local    replication  /^rcv_                            reject

# Everything else, as the official image's own file has it: the socket (the image's initialization and its health
# check, inside the container) trusted; every other connection by its password.
local    all          all                               trust
host     all          all                 all           scram-sha-256
