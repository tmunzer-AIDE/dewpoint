name: dewpoint
x-app: &app
  image: ${DEWPOINT_APP_IMAGE:-dewpoint-app:dev}
  build: { context: ../.., dockerfile: deploy/docker/app.Dockerfile }
  read_only: true
  tmpfs: [/tmp]
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  environment: &appenv
    DEWPOINT_KEK_B64: ${DEWPOINT_KEK_B64:?set in .env}
    DEWPOINT_KEK_ID: ${DEWPOINT_KEK_ID:-env-1}
    # Set only during a KEK rollout: docs/operations/key-rotation.md
    DEWPOINT_KEK_PREVIOUS_B64: ${DEWPOINT_KEK_PREVIOUS_B64:-}
    DEWPOINT_KEK_PREVIOUS_ID: ${DEWPOINT_KEK_PREVIOUS_ID:-}
    DEWPOINT_PUBLIC_ORIGIN: ${DEWPOINT_PUBLIC_ORIGIN:-http://localhost:8080}
    DEWPOINT_RP_ID: ${DEWPOINT_RP_ID:-localhost}
    # Recorded once by the migrate step, and checked by every process that talks to Temporal (engine 2b spec §2.1).
    DEWPOINT_TEMPORAL_NAMESPACE: ${DEWPOINT_TEMPORAL_NAMESPACE:-default}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: dewpoint
      POSTGRES_USER: dewpoint_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      DEWPOINT_API_DB_PASSWORD: ${DEWPOINT_API_DB_PASSWORD:?set in .env}
      DEWPOINT_ADMIN_DB_PASSWORD: ${DEWPOINT_ADMIN_DB_PASSWORD:?set in .env}
      DEWPOINT_AUDITOR_DB_PASSWORD: ${DEWPOINT_AUDITOR_DB_PASSWORD:?set in .env}
      DEWPOINT_WORKER_DB_PASSWORD: ${DEWPOINT_WORKER_DB_PASSWORD:?set in .env}
      DEWPOINT_DISPATCH_DB_PASSWORD: ${DEWPOINT_DISPATCH_DB_PASSWORD:?set in .env}
      DEWPOINT_INGRESS_DB_PASSWORD: ${DEWPOINT_INGRESS_DB_PASSWORD:?set in .env}
      DEWPOINT_RETENTION_DB_PASSWORD: ${DEWPOINT_RETENTION_DB_PASSWORD:?set in .env}
    volumes: [pgdata:/var/lib/postgresql/data, ./initdb:/docker-entrypoint-initdb.d:ro]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U dewpoint_owner -d dewpoint"], interval: 5s, retries: 20 }

  migrate:
    <<: *app
    # The schema, then what this deployment is, recorded once (engine 2b spec §2.1): production and gated unless a
    # development setup opts in with its own database and Temporal namespace. Every later run checks the same values.
    # Then a data key for any tenant without one (created before 2b-1a): the payload codec only reads keys (§6.3). The
    # key admin lists every tenant under row-level security (migration 0013), so it needs no role that bypasses it.
    command:
      - sh
      - -c
      - >-
        set -e; alembic upgrade head; dewpoint platform init-environment;
        DEWPOINT_DATABASE_URL=$$DEWPOINT_ADMIN_DATABASE_URL dewpoint keys ensure-tenants
    environment:
      <<: *appenv
      DEWPOINT_DATABASE_URL: postgresql+asyncpg://dewpoint_owner:${POSTGRES_PASSWORD}@postgres/dewpoint
      DEWPOINT_ADMIN_DATABASE_URL: postgresql+asyncpg://dewpoint_admin_login:${DEWPOINT_ADMIN_DB_PASSWORD}@postgres/dewpoint
      DEWPOINT_ENVIRONMENT: ${DEWPOINT_ENVIRONMENT:-production}
    depends_on: { postgres: { condition: service_healthy } }
    restart: "no"

  api:
    <<: *app
    environment:
      <<: *appenv
      DEWPOINT_DATABASE_URL: postgresql+asyncpg://dewpoint_api_login:${DEWPOINT_API_DB_PASSWORD}@postgres/dewpoint
      # Webhook endpoints' secrets are sealed under it (engine 2b spec §8.3): without it, the API makes none (503).
      DEWPOINT_INGRESS_KEY_B64: ${DEWPOINT_INGRESS_KEY_B64:-}
      DEWPOINT_INGRESS_KEY_ID: ${DEWPOINT_INGRESS_KEY_ID:-ingress-1}
      # Set only during the ingress key's rollout: docs/operations/key-rotation.md
      DEWPOINT_INGRESS_KEY_PREVIOUS_B64: ${DEWPOINT_INGRESS_KEY_PREVIOUS_B64:-}
      DEWPOINT_INGRESS_KEY_PREVIOUS_ID: ${DEWPOINT_INGRESS_KEY_PREVIOUS_ID:-}
    depends_on: { migrate: { condition: service_completed_successfully } }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health/ready').status==200 else 1)"]
      interval: 5s
      retries: 20

  audit-anchor:
    <<: *app
    # Anchors belong OFF this host in production (object lock / SIEM). This volume is for evaluation only.
    # set -e: a failed anchor run ends the container with a nonzero exit (visible in `docker compose ps -a`),
    # instead of looping silently without producing anchors.
    command: ["sh", "-c", "set -e; while true; do dewpoint audit anchor; sleep 900; done"]
    restart: "no"
    # Unhealthy when audit rows older than 30 minutes have no anchor (job stuck, failing, or anchors stale).
    # Alert on this in your monitoring as well.
    healthcheck:
      test: ["CMD", "dewpoint", "audit", "freshness", "--max-age-minutes", "30"]
      interval: 5m
      timeout: 30s
      start_period: 1m
      start_interval: 5s
      retries: 1
    environment:
      <<: *appenv
      DEWPOINT_DATABASE_URL: postgresql+asyncpg://dewpoint_auditor_login:${DEWPOINT_AUDITOR_DB_PASSWORD}@postgres/dewpoint
      DEWPOINT_AUDIT_SIGNING_KEY_B64: ${DEWPOINT_AUDIT_SIGNING_KEY_B64:?set in .env}
      DEWPOINT_AUDIT_ANCHOR_PATH: /anchors/anchors.jsonl
    volumes: [anchors:/anchors]
    depends_on: { migrate: { condition: service_completed_successfully } }

  temporal:
    # Temporal's dev server: one container, its state in SQLite on a volume. For evaluation: production runs a
    # Temporal cluster (docs/operations/deployment.md). Its Web UI is on this host only.
    image: temporalio/temporal:1.9.1
    command: ["server", "start-dev", "--ip", "0.0.0.0", "--ui-ip", "0.0.0.0", "--db-filename", "/home/temporal/temporal.db"]
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    volumes: [temporal-data:/home/temporal]  # the image's user owns its home: the new volume takes that ownership
    ports: ["127.0.0.1:8233:8233"]
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "127.0.0.1:7233"]
      interval: 5s
      retries: 30

  worker:
    <<: *app
    command: ["dewpoint", "worker"]
    environment:
      <<: *appenv
      DEWPOINT_DATABASE_URL: postgresql+asyncpg://dewpoint_worker_login:${DEWPOINT_WORKER_DB_PASSWORD}@postgres/dewpoint
      DEWPOINT_TEMPORAL_ADDRESS: temporal:7233
      DEWPOINT_CEL_SOCKET: /run/dewpoint-cel/cel.sock
      DEWPOINT_CEL_MAX_CONCURRENT: "2"  # the evaluator's slots at 2 CPUs (docs/operations/cel-evaluator.md)
      # Compose runs one build at a time: the worker makes its build current (docs/operations/deployment.md).
      DEWPOINT_WORKER_SET_CURRENT: "true"
    volumes: [cel-socket:/run/dewpoint-cel]
    stop_grace_period: 45s  # longer than DEWPOINT_WORKER_SHUTDOWN_GRACE_S (30 s): running attempts finish
    depends_on:
      migrate: { condition: service_completed_successfully }
      temporal: { condition: service_healthy }
      cel-evaluator: { condition: service_healthy }

  dispatcher:
    <<: *app
    # Starts admitted runs within each tenant's slots, and leads the reconciler when no other dispatcher does
    # (engine 2b spec §7.3, §7.6; docs/operations/runs.md). The API admits runs but never talks to Temporal.
    command: ["dewpoint", "dispatcher"]
    environment:
      <<: *appenv
      DEWPOINT_DATABASE_URL: postgresql+asyncpg://dewpoint_dispatch_login:${DEWPOINT_DISPATCH_DB_PASSWORD}@postgres/dewpoint
      DEWPOINT_TEMPORAL_ADDRESS: temporal:7233
    stop_grace_period: 15s  # longer than a start's own deadline (10 s): a start in flight gets its answer
    restart: unless-stopped  # a dispatcher that ends comes back: queued runs keep starting
    depends_on:
      migrate: { condition: service_completed_successfully }
      temporal: { condition: service_healthy }

  retention:
    <<: *app
    # Deletes each tenant's data past its retention, every hour (engine 2b spec §10.3; docs/operations/retention.md),
    # as the only login that may. It never decrypts anything: its environment holds no key.
    command: ["dewpoint", "retention"]
    environment:
      DEWPOINT_DATABASE_URL: postgresql+asyncpg://dewpoint_retention_login:${DEWPOINT_RETENTION_DB_PASSWORD}@postgres/dewpoint
    restart: unless-stopped  # the SLO needs a successful sweep a day: one that ends comes back
    depends_on:
      migrate: { condition: service_completed_successfully }

  cel-evaluator:
    image: ${DEWPOINT_CEL_EVALUATOR_IMAGE:-dewpoint-cel-evaluator:dev}
    build: { context: ../.., dockerfile: deploy/docker/cel-evaluator.Dockerfile }
    # Secretless and egress-free (spec §5.7): no network at all, no environment beyond its own settings. The worker
    # reaches it through the socket on the `cel-socket` volume, which only the two mount.
    network_mode: none
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    # The evaluator derives its concurrency from these: N = min(CPUs, floor((memory - 256 MiB) / 264.25 MiB)).
    mem_limit: 2g
    cpus: 2
    pids_limit: 14  # N + 8, for up to 6 slots
    volumes: [cel-socket:/run/dewpoint-cel]
    healthcheck:
      test: ["CMD", "python", "-m", "dewpoint.apps.cel_evaluator", "--health"]
      interval: 5s
      retries: 20

  ingress:
    <<: *app
    # Webhook ingress (engine 2b spec §8.3; docs/operations/ingress.md): a gated prototype until engine 2b-4, so only
    # the `ingress` profile starts it, and it refuses to start unless the deployment is `development` (the development
    # override). Its environment is its own, never the KEK: it refuses to start with one. It publishes no port: `web`
    # proxies /hooks/ to it on the `hooks` network.
    profiles: [ingress]
    command: ["dewpoint", "ingress", "--host", "0.0.0.0", "--port", "8001"]
    environment:
      DEWPOINT_DATABASE_URL: postgresql+asyncpg://dewpoint_ingress_login:${DEWPOINT_INGRESS_DB_PASSWORD}@postgres/dewpoint
      DEWPOINT_INGRESS_KEY_B64: ${DEWPOINT_INGRESS_KEY_B64:-}
      DEWPOINT_INGRESS_KEY_ID: ${DEWPOINT_INGRESS_KEY_ID:-ingress-1}
      # Set only during the ingress key's rollout: docs/operations/key-rotation.md
      DEWPOINT_INGRESS_KEY_PREVIOUS_B64: ${DEWPOINT_INGRESS_KEY_PREVIOUS_B64:-}
      DEWPOINT_INGRESS_KEY_PREVIOUS_ID: ${DEWPOINT_INGRESS_KEY_PREVIOUS_ID:-}
      # X-Forwarded-For is believed from `web` only: the `hooks` network, where it's ingress's one peer (ruling 11).
      DEWPOINT_INGRESS_TRUSTED_PROXIES: ${DEWPOINT_HOOKS_SUBNET:-172.31.255.248/29}
    networks:
      default:
      hooks: { aliases: [hooks-ingress] }
    depends_on: { migrate: { condition: service_completed_successfully } }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8001/health/ready').status==200 else 1)"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  web:
    image: ${DEWPOINT_WEB_IMAGE:-dewpoint-web:dev}
    build: { context: ../.., dockerfile: deploy/docker/web.Dockerfile }
    read_only: true
    tmpfs: [/tmp, /var/cache/nginx]
    cap_drop: [ALL]
    ports: ["127.0.0.1:8080:8080"]
    environment:
      # IPs/CIDRs of the TLS proxy / load balancer in front of `web` (see README). Empty = no proxy.
      DEWPOINT_TRUSTED_PROXIES: ${DEWPOINT_TRUSTED_PROXIES:-}
    networks: [default, hooks]
    depends_on: { api: { condition: service_healthy } }

networks:
  # `web` and ingress only: ingress believes X-Forwarded-For from this range, where `web` is its only peer. Change it
  # (DEWPOINT_HOOKS_SUBNET) if it overlaps a network of this host's.
  hooks:
    ipam: { config: [{ subnet: "${DEWPOINT_HOOKS_SUBNET:-172.31.255.248/29}" }] }

volumes: { pgdata: {}, anchors: {}, cel-socket: {}, temporal-data: {} }
